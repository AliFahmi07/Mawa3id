{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="auth-container">

  <div class="auth-card">
    <h1 class="auth-title">Log In</h1>

    <form method="post" action="{% url 'login' %}" class="auth-form">
      {% csrf_token %}
      {{ form.as_p }}
      <input type="submit" class="btn primary-btn" value="Login">
    </form>

    <div class="divider">
      <span>OR</span>
    </div>

    <form action="/google/google/login/" method="post">
      {% csrf_token %}
      <button type="submit" class="btn google-btn">
        Continue with Google
      </button>
    </form>

  </div>

</div>
{% endblock %}
