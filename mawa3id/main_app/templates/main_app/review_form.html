{% extends 'base.html' %}
{% block content %}

<div class="form-page-container">
  <div class="form-page-card">
    {% if object %}
      <h1 class="form-page-title">Update Review</h1>
    {% else %}
      <h1 class="form-page-title">Write a Review</h1>
    {% endif %}

    <form action="" method="post" class="auth-form">
      {% csrf_token %}
      {{ form.as_p }}

      <div class="form-actions">
        <button type="submit" class="btn primary-btn">
          {% if object %}Update{% else %}Submit{% endif %} Review
        </button>
        <a href="javascript:history.back()" class="btn cancel-btn">Cancel</a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
