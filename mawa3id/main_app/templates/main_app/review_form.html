{% extends 'base.html' %}
{% block content %}

<div class="container">
    <h1>Edit Your Review</h1>
    
    <form action="" method="post">
        {% csrf_token %}
        
        <label for="id_rating">Rating:</label>
        <select name="rating" id="id_rating" required>
            <option value="5" {% if object.rating == 5 %}selected{% endif %}>(5)</option>
            <option value="4" {% if object.rating == 4 %}selected{% endif %}>(4)</option>
            <option value="3" {% if object.rating == 3 %}selected{% endif %}>(3)</option>
            <option value="2" {% if object.rating == 2 %}selected{% endif %}>(2)</option>
            <option value="1" {% if object.rating == 1 %}selected{% endif %}>(1)</option>
        </select>
        
        <label for="id_text">Your Review:</label>
        <textarea name="text" id="id_text" maxlength="500" rows="5" required>{{ object.text }}</textarea>
        
        <button type="submit" class="btn">Update Review</button>
        <a href="{% url 'home' %}" class="btn grey">Cancel</a>
    </form>
</div>

{% endblock %}
