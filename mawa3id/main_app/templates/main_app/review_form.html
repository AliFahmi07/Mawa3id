{% extends 'base.html' %}
{% block content %}

<div class="container">
    <h1>{% if object %}Edit Your Review{% else %}Write a Review{% endif %}</h1>
    
    <form action="" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        
        <button type="submit" class="btn">{% if object %}Update Review{% else %}Submit Review{% endif %}</button>
        <a href="{% url 'home' %}" class="btn grey">Cancel</a>
    </form>
</div>

{% endblock %}
