{% extends 'base.html' %}
{% block content %}

<div class="form-page-container">
  <div class="form-page-card">
    <h1 class="form-page-title">Create Profile</h1>

    <form action="" method="post" enctype="multipart/form-data" class="auth-form">
      {% csrf_token %}
      {{ form.as_p }}

      <div class="form-actions">
        <button type="submit" class="btn primary-btn">Create Profile</button>
        <a href="{% url 'home' %}" class="btn cancel-btn">Cancel</a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
