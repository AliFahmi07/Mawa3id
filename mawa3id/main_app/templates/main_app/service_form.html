{% extends 'base.html' %}

{% block content %}
<div class="form-page-container">
  <div class="form-page-card">

    <h1 class="form-page-title">
      {% if form.instance.pk %}
        Edit Service
      {% else %}
        Create Service
      {% endif %}
    </h1>

    <form method="post" class="styled-form">
      {% csrf_token %}

      {{ form.as_p }}

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">
          {% if form.instance.pk %}
            Edit Service
          {% else %}
            Create Service
          {% endif %}
        </button>
        <a href="{% url 'business_detail' business.id %}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>

  </div>
</div>
{% endblock %}
