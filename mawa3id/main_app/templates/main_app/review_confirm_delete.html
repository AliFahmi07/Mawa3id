{% extends 'base.html' %}
{% block content %}

<div class="form-page-container">
    <div class="confirm-delete-card">
        <h1 class="confirm-delete-title">Delete Review</h1>
        
        <div class="confirm-delete-warning">
            <p class="warning-text">Are you sure you want to delete this review?</p>
        </div>
        
        <div class="confirm-delete-details">
            <div class="detail-row">
                <span class="detail-label">Service:</span>
                <span class="detail-value">{{ object.service.name }}</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Rating:</span>
                <span class="detail-value">{{ object.rating }} ★</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Review:</span>
                <span class="detail-value">{{ object.text }}</span>
            </div>
        </div>
        
        <form action="" method="POST">
            {% csrf_token %}
            <div class="form-actions">
                <button type="submit" class="btn btn-danger">Yes - Delete Review</button>
                <a href="{{ request.META.HTTP_REFERER|default:'home' }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
