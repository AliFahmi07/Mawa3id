{% extends 'base.html' %}

{% block content %}
    <h1>Delete Post</h1>

    <h4>Are you sure to delete post?</h4>

    <form action='' method="post">
        {% csrf_token %}
        <input type="submit" value="Yes" class="btn">
        <a href="{% url 'posts_detail' object.id %}">Cancel</a>
    </form>
{% endblock %}
