{% extends 'base.html' %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1 class="auth-title">Delete Post</h1>
        
        <div class="delete-warning">
            <p>Are you sure you want to delete this post?</p>
        </div>

        <form action='' method="post" class="auth-form">
            {% csrf_token %}
            <input type="submit" value="Yes, Delete" class="btn danger-btn">
            <a href="{% url 'posts_detail' object.id %}" class="btn cancel-btn">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
