{% extends 'base.html' %}

{% block content %}

    <div class="form-container">
        {% if object %}
            <h1>Edit Post</h1>
        {% else %}
            <h1>Create New Post</h1>
        {% endif %}

        <form action="" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <table>
                {{ form.as_table }}
            </table>
            
            <div class="form-actions">
                <input type="submit" value="Submit" class="btn">
                <a href="{% url 'posts_index' %}" class="btn cancel-btn">Cancel</a>
            </div>
        </form>
    </div>

{% endblock %}
