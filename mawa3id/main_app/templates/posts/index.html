{% extends "base.html" %}

{% block content %}
<a href="{% url 'posts_create' %}">Add new Post</a>

{% for post in posts %}
  <div class="card">
    <a href="{% url 'posts_detail' post.id %}">
    <div class="card-content">
      <span class="card-title">{{ post.user }}</span>
      <p>Description: {{ post.description }}</p>
      <p>Price: ${{ post.price }}</p>
      <hr>
    </div>
    </a>
  </div>

  {% comment %} <a href="{% url 'posts_create' %}">Add new Post</a> {% endcomment %}

{% endfor %}


{% endblock %}
